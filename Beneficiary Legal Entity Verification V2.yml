    - data:
        code: "def count_tokens(text):\n    if not text:\n        return 0\n\n   \
          \ return len([\n        token\n        for token in text.split()\n     \
          \   if token\n    ])\n\n\ndef build_result(\n    decision,\n    action,\n\
          \    risk_level,\n    reason_code,\n    ai_eligible=False,\n    review_mode=\"\
          NONE\"\n):\n    return {\n        \"decision\": decision,\n        \"action\"\
          : action,\n        \"risk_level\": risk_level,\n        \"reason_code\"\
          : reason_code,\n        \"ai_eligible\": ai_eligible,\n        \"review_mode\"\
          : review_mode\n    }\n\n\ndef main(invoice_normalized: str, payment_normalized:\
          \ str, invoice_legal_type: str, payment_legal_type: str, legal_type_conflict,\
          \ name_similarity: float, invoice_core_name: str, payment_core_name: str,\
          \ core_sequence_similarity: float, core_token_similarity: float, core_containment_score:\
          \ float, full_name_exact_match, core_name_exact_match, same_core_token_set,\
          \ core_word_order_only, short_name_detected, legal_type_match) -> dict:\n\
          \n    invoice_normalized = (\n        invoice_normalized or \"\"\n    ).strip()\n\
          \n    payment_normalized = (\n        payment_normalized or \"\"\n    ).strip()\n\
          \n    invoice_core_name = (\n        invoice_core_name or \"\"\n    ).strip()\n\
          \n    payment_core_name = (\n        payment_core_name or \"\"\n    ).strip()\n\
          \n    invoice_legal_type = (\n        invoice_legal_type or \"UNKNOWN\"\n\
          \    )\n\n    payment_legal_type = (\n        payment_legal_type or \"UNKNOWN\"\
          \n    )\n\n    name_similarity = float(\n        name_similarity or 0.0\n\
          \    )\n\n    core_sequence_similarity = float(\n        core_sequence_similarity\
          \ or 0.0\n    )\n\n    core_token_similarity = float(\n        core_token_similarity\
          \ or 0.0\n    )\n\n    core_containment_score = float(\n        core_containment_score\
          \ or 0.0\n    )\n\n    minimum_core_token_count = min(\n        count_tokens(invoice_core_name),\n\
          \        count_tokens(payment_core_name)\n    )\n\n    # Rule 1: Thiếu tên\n\
          \    if (\n        not invoice_normalized\n        or not payment_normalized\n\
          \    ):\n        return build_result(\n            decision=\"REVIEW\",\n\
          \            action=\"WARN\",\n            risk_level=\"MEDIUM\",\n    \
          \        reason_code=\"INSUFFICIENT_DATA\",\n            ai_eligible=False,\n\
          \            review_mode=\"DETERMINISTIC_WARNING\"\n        )\n\n    # Rule\
          \ 2: Xung đột loại hình pháp nhân\n    if legal_type_conflict:\n       \
          \ return build_result(\n            decision=\"NOT_MATCH\",\n          \
          \  action=\"BLOCK\",\n            risk_level=\"HIGH\",\n            reason_code=\"\
          LEGAL_ENTITY_TYPE_CONFLICT\"\n        )\n\n    # Rule 3: Tên giống hệt sau\
          \ normalize\n    # Xử lý: dấu, hoa-thường, punctuation, abbreviation.\n\
          \    if full_name_exact_match:\n        return build_result(\n         \
          \   decision=\"MATCH\",\n            action=\"ALLOW\",\n            risk_level=\"\
          LOW\",\n            reason_code=\"NORMALIZED_NAME_EXACT_MATCH\"\n      \
          \  )\n\n    # Rule 4: Core name giống hệt và legal type giống nhau.\n  \
          \  # Yêu cầu ít nhất 2 token để tránh auto-match \"ABC\".\n    if (\n  \
          \      legal_type_match\n        and core_name_exact_match\n        and\
          \ minimum_core_token_count >= 2\n        and not short_name_detected\n \
          \   ):\n        return build_result(\n            decision=\"MATCH\",\n\
          \            action=\"ALLOW\",\n            risk_level=\"LOW\",\n      \
          \      reason_code=\"LEGAL_TYPE_AND_CORE_NAME_EXACT_MATCH\"\n        )\n\
          \n    # Rule 5: Cùng bộ từ, chỉ khác thứ tự.\n    if (\n        legal_type_match\n\
          \        and same_core_token_set\n        and minimum_core_token_count >=\
          \ 2\n        and not short_name_detected\n    ):\n        return build_result(\n\
          \            decision=\"MATCH\",\n            action=\"ALLOW\",\n      \
          \      risk_level=\"LOW\",\n            reason_code=\"LEGAL_TYPE_AND_CORE_TOKEN_SET_MATCH\"\
          \n        )\n\n    # Rule 6: Core rất giống và legal type đã xác định.\n\
          \    # Threshold vẫn cần hiệu chỉnh bằng Golden Dataset.\n    if (\n   \
          \     legal_type_match\n        and core_sequence_similarity >= 0.96\n \
          \       and core_token_similarity >= 0.90\n        and core_containment_score\
          \ >= 0.90\n        and minimum_core_token_count >= 3\n        and not short_name_detected\n\
          \    ):\n        return build_result(\n            decision=\"MATCH\",\n\
          \            action=\"ALLOW\",\n            risk_level=\"LOW\",\n      \
          \      reason_code=\"HIGH_CORE_NAME_SIMILARITY\"\n        )\n\n    # Rule\
          \ 7: Tên ngắn/rút gọn.\n    # Không gọi AI vì có thể cảnh báo bằng template.\n\
          \    if (\n        short_name_detected\n        and core_containment_score\
          \ >= 1.0\n    ):\n        return build_result(\n            decision=\"\
          REVIEW\",\n            action=\"WARN\",\n            risk_level=\"MEDIUM\"\
          ,\n            reason_code=\"PARTIAL_CORE_NAME_MATCH\",\n            ai_eligible=False,\n\
          \            review_mode=\"DETERMINISTIC_WARNING\"\n        )\n\n    # Rule\
          \ 8: Core name trùng mạnh nhưng thiếu legal type.\n    if (\n        (\n\
          \            invoice_legal_type == \"UNKNOWN\"\n            or payment_legal_type\
          \ == \"UNKNOWN\"\n        )\n        and core_name_exact_match\n       \
          \ and minimum_core_token_count >= 2\n        and not short_name_detected\n\
          \    ):\n        return build_result(\n            decision=\"REVIEW\",\n\
          \            action=\"WARN\",\n            risk_level=\"MEDIUM\",\n    \
          \        reason_code=\"LEGAL_TYPE_MISSING_CORE_NAME_MATCH\",\n         \
          \   ai_eligible=False,\n            review_mode=\"DETERMINISTIC_WARNING\"\
          \n        )\n\n    # Rule 9: Mơ hồ thực sự mới gọi AI.\n    if (\n     \
          \   name_similarity >= 0.82\n        or core_sequence_similarity >= 0.82\n\
          \        or core_token_similarity >= 0.75\n    ):\n        return build_result(\n\
          \            decision=\"REVIEW\",\n            action=\"WARN\",\n      \
          \      risk_level=\"MEDIUM\",\n            reason_code=\"NAME_SIMILAR_BUT_NOT_CONCLUSIVE\"\
          ,\n            ai_eligible=True,\n            review_mode=\"AI_WARNING\"\
          \n        )\n\n    # Rule 10: Khác biệt lớn\n    return build_result(\n\
          \        decision=\"NOT_MATCH\",\n        action=\"BLOCK\",\n        risk_level=\"\
          HIGH\",\n        reason_code=\"LOW_NAME_SIMILARITY\"\n    )"
