    - data:
        code: "ALLOWED_WARNING_CODES = {\n    \"PARTIAL_CORE_NAME_MATCH\",\n    \"\
          NAME_SIMILAR_BUT_NOT_CONCLUSIVE\",\n    \"INSUFFICIENT_DATA\",\n    \"PAYMENT_LEGAL_TYPE_UNKNOWN\"\
          ,\n    \"POSSIBLE_OCR_ERROR\"\n}\n\n\ndef main(ai_warning_code, ai_warning_title,\
          \ ai_warning_message, ai_checks_required) -> dict:\n\n    code_valid = (\n\
          \        ai_warning_code in ALLOWED_WARNING_CODES\n    )\n\n    content_valid\
          \ = (\n        bool(ai_warning_title)\n        and bool(ai_warning_message)\n\
          \        and isinstance(ai_checks_required, list)\n        and len(ai_checks_required)\
          \ > 0\n    )\n\n    if code_valid and content_valid:\n        return {\n\
          \            \"warning_code\": ai_warning_code,\n            \"warning_title\"\
          : ai_warning_title,\n            \"warning_message\": ai_warning_message,\n\
          \            \"checks_required\": ai_checks_required[:3],\n            \"\
          generated_by_ai\": True,\n            \"ai_status\": \"SUCCESS\"\n     \
          \   }\n\n    return {\n        \"warning_code\": \"AI_WARNING_FALLBACK\"\
