    - data:
        code: "from difflib import SequenceMatcher\n\n\ndef to_token_set(tokens, fallback_text):\n\
          \    if isinstance(tokens, list):\n        return {\n            str(token).strip()\n\
          \            for token in tokens\n            if str(token).strip()\n  \
          \      }\n\n    if fallback_text:\n        return {\n            token\n\
          \            for token in fallback_text.split()\n            if token\n\
          \        }\n\n    return set()\n\n\ndef sequence_score(first_text, second_text):\n\
          \    first_text = first_text or \"\"\n    second_text = second_text or \"\
          \"\n\n    if not first_text or not second_text:\n        return 0.0\n\n\
          \    return SequenceMatcher(\n        None,\n        first_text,\n     \
          \   second_text\n    ).ratio()\n\n\ndef jaccard_score(first_tokens, second_tokens):\n\
          \    if not first_tokens or not second_tokens:\n        return 0.0\n\n \
          \   union_tokens = first_tokens.union(\n        second_tokens\n    )\n\n\
          \    if not union_tokens:\n        return 0.0\n\n    return (\n        len(first_tokens.intersection(second_tokens))\n\
          \        / len(union_tokens)\n    )\n\n\ndef containment_score(first_tokens,\
          \ second_tokens):\n    if not first_tokens or not second_tokens:\n     \
          \   return 0.0\n\n    smaller_size = min(\n        len(first_tokens),\n\
          \        len(second_tokens)\n    )\n\n    if smaller_size == 0:\n      \
          \  return 0.0\n\n    intersection_size = len(\n        first_tokens.intersection(second_tokens)\n\
          \    )\n\n    return intersection_size / smaller_size\n\n\ndef main(\n \
          \   invoice_normalized: str,\n    payment_normalized: str,\n    invoice_core_name:\
          \ str,\n    payment_core_name: str,\n    invoice_core_tokens: list,\n  \
          \  payment_core_tokens: list\n) -> dict:\n\n    invoice_normalized = (\n\
          \        invoice_normalized or \"\"\n    ).strip()\n\n    payment_normalized\
          \ = (\n        payment_normalized or \"\"\n    ).strip()\n\n    invoice_core_name\
          \ = (\n        invoice_core_name or \"\"\n    ).strip()\n\n    payment_core_name\
          \ = (\n        payment_core_name or \"\"\n    ).strip()\n\n    full_invoice_tokens\
          \ = set(\n        invoice_normalized.split()\n    )\n\n    full_payment_tokens\
          \ = set(\n        payment_normalized.split()\n    )\n\n    invoice_core_set\
          \ = to_token_set(\n        invoice_core_tokens,\n        invoice_core_name\n\
          \    )\n\n    payment_core_set = to_token_set(\n        payment_core_tokens,\n\
          \        payment_core_name\n    )\n\n    full_sequence = sequence_score(\n\
          \        invoice_normalized,\n        payment_normalized\n    )\n\n    full_token\
          \ = jaccard_score(\n        full_invoice_tokens,\n        full_payment_tokens\n\
          \    )\n\n    core_sequence = sequence_score(\n        invoice_core_name,\n\
          \        payment_core_name\n    )\n\n    core_token = jaccard_score(\n \
          \       invoice_core_set,\n        payment_core_set\n    )\n\n    core_containment\
          \ = containment_score(\n        invoice_core_set,\n        payment_core_set\n\
          \    )\n\n    full_name_exact_match = (\n        bool(invoice_normalized)\n\
          \        and invoice_normalized\n        == payment_normalized\n    )\n\n\
          \    core_name_exact_match = (\n        bool(invoice_core_name)\n      \
          \  and invoice_core_name\n        == payment_core_name\n    )\n\n    same_core_token_set\
          \ = (\n        bool(invoice_core_set)\n        and invoice_core_set\n  \
          \      == payment_core_set\n    )\n\n    core_word_order_only = (\n    \
          \    same_core_token_set\n        and not core_name_exact_match\n    )\n\
          \n    shortest_token_count = min(\n        len(invoice_core_set),\n    \
          \    len(payment_core_set)\n    )\n\n    shortest_core_length = min(\n \
          \       len(invoice_core_name),\n        len(payment_core_name)\n    )\n\
          \n    short_name_detected = (\n        shortest_token_count <= 1\n     \
          \   or shortest_core_length <= 4\n    )\n\n    weighted_score = (\n    \
          \    full_sequence * 0.15\n        + full_token * 0.15\n        + core_sequence\
          \ * 0.25\n        + core_token * 0.30\n        + core_containment * 0.15\n\
          \    )\n\n    return {\n        \"sequence_similarity\":\n            round(full_sequence,\
          \ 4),\n\n        \"token_similarity\":\n            round(full_token, 4),\n\
          \n        \"core_sequence_similarity\":\n            round(core_sequence,\
          \ 4),\n\n        \"core_token_similarity\":\n            round(core_token,\
          \ 4),\n\n        \"core_containment_score\":\n            round(core_containment,\
          \ 4),\n\n        \"name_similarity\":\n            round(weighted_score,\
          \ 4),\n\n        \"full_name_exact_match\":\n            full_name_exact_match,\n\
          \n        \"core_name_exact_match\":\n            core_name_exact_match,\n\
          \n        \"same_core_token_set\":\n            same_core_token_set,\n\n\
          \        \"core_word_order_only\":\n            core_word_order_only,\n\n\
          \        \"short_name_detected\":\n            short_name_detected\n   \
          \ }"
