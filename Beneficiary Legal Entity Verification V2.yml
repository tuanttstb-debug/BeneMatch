    - data:
        code: "import re\nimport unicodedata\n\n\nREPLACEMENTS = [\n    # C.T.C.P\
          \ / CTCP / Công ty CP\n    (\n        r\"\\bC\\s*\\.?\\s*T\\s*\\.?\\s*C\\\
          s*\\.?\\s*P\\b\",\n        \"CONG TY CO PHAN\"\n    ),\n    (\n        r\"\
          \\bCTCP\\b\",\n        \"CONG TY CO PHAN\"\n    ),\n    (\n        r\"\\\
          bCONG TY CP\\b\",\n        \"CONG TY CO PHAN\"\n    ),\n\n    # English\
          \ joint-stock forms\n    (\n        r\"\\bJOINT STOCK COMPANY\\b\",\n  \
          \      \"CONG TY CO PHAN\"\n    ),\n    (\n        r\"\\bJOINT STOCK CO\\\
          b\",\n        \"CONG TY CO PHAN\"\n    ),\n    (\n        r\"\\bJSC\\b\"\
          ,\n        \"CONG TY CO PHAN\"\n    ),\n\n    # C.TY / CTY\n    (\n    \
          \    r\"\\bC\\s*\\.?\\s*TY\\b\",\n        \"CONG TY\"\n    ),\n    (\n \
          \       r\"\\bCTY\\b\",\n        \"CONG TY\"\n    ),\n\n    # Trách nhiệm\
          \ hữu hạn\n    (\n        r\"\\bCONG TY TRACH NHIEM HUU HAN \"\n       \
          \ r\"MOT THANH VIEN\\b\",\n        \"CONG TY TNHH MOT THANH VIEN\"\n   \
          \ ),\n    (\n        r\"\\bCONG TY TRACH NHIEM HUU HAN\\b\",\n        \"\
          CONG TY TNHH\"\n    ),\n    (\n        r\"\\bT\\s*\\.?\\s*N\\s*\\.?\\s*H\\\
          s*\\.?\\s*H\\b\",\n        \"TNHH\"\n    ),\n\n    # Một thành viên\n  \
          \  (\n        r\"\\bTNHH MTV\\b\",\n        \"TNHH MOT THANH VIEN\"\n  \
          \  ),\n    (\n        r\"\\bTNHH 1 TV\\b\",\n        \"TNHH MOT THANH VIEN\"\
          \n    ),\n\n    # English limited-company forms\n    (\n        r\"\\bCOMPANY\
          \ LIMITED\\b\",\n        \"CONG TY TNHH\"\n    ),\n    (\n        r\"\\\
          bLIMITED LIABILITY COMPANY\\b\",\n        \"CONG TY TNHH\"\n    ),\n   \
          \ (\n        r\"\\bCO LTD\\b\",\n        \"CONG TY TNHH\"\n    ),\n    (\n\
          \        r\"\\bLTD\\b\",\n        \"CONG TY TNHH\"\n    ),\n\n    # Other\
          \ legal forms\n    (\n        r\"\\bDNTN\\b\",\n        \"DOANH NGHIEP TU\
          \ NHAN\"\n    ),\n    (\n        r\"\\bHTX\\b\",\n        \"HOP TAC XA\"\
          \n    ),\n\n    # Symbol\n    (\n        r\"\\s*&\\s*\",\n        \" VA\
          \ \"\n    )\n]\n\n\nLEGAL_PREFIXES = [\n    \"CONG TY TNHH MOT THANH VIEN\"\
          ,\n    \"CONG TY CO PHAN\",\n    \"CONG TY TNHH\",\n    \"DOANH NGHIEP TU\
          \ NHAN\",\n    \"HOP TAC XA\",\n    \"CONG TY\"\n]\n\n\ndef remove_accents(text):\n\
          \    text = unicodedata.normalize(\n        \"NFD\",\n        text\n   \
          \ )\n\n    text = \"\".join(\n        character\n        for character in\
          \ text\n        if unicodedata.category(character) != \"Mn\"\n    )\n\n\
          \    # Bảo đảm xử lý Đ/đ\n    return text.replace(\n        \"Đ\",\n   \
          \     \"D\"\n    ).replace(\n        \"đ\",\n        \"d\"\n    )\n\n\n\
          def normalize_name(text):\n    if not text:\n        return \"\"\n\n   \
          \ text = str(text).upper().strip()\n    text = remove_accents(text)\n\n\
          \    # Chuẩn hóa dấu câu thông thường.\n    # Chưa xóa dấu chấm vì cần xử\
          \ lý C.TY, T.N.H.H trước.\n    text = re.sub(\n        r\"[,;:/\\\\\\-_()\\\
          [\\]{}\\\"'`]+\",\n        \" \",\n        text\n    )\n\n    for pattern,\
          \ replacement in REPLACEMENTS:\n        text = re.sub(\n            pattern,\n\
          \            replacement,\n            text\n        )\n\n    # Xóa dấu\
          \ chấm còn lại sau khi xử lý abbreviation\n    text = re.sub(\n        r\"\
          \\.+\",\n        \" \",\n        text\n    )\n\n    text = re.sub(\n   \
          \     r\"\\s+\",\n        \" \",\n        text\n    ).strip()\n\n    return\
          \ text\n\n\ndef extract_core_name(normalized_name):\n    \"\"\"\n    Chỉ\
          \ loại tiền tố pháp lý ở đầu tên.\n    Không xóa từ ngành nghề.\n    \"\"\
          \"\n    if not normalized_name:\n        return \"\"\n\n    core_name =\
          \ normalized_name\n\n    for legal_prefix in LEGAL_PREFIXES:\n        core_name\
          \ = re.sub(\n            rf\"^\\s*{re.escape(legal_prefix)}\\s+\",\n   \
          \         \"\",\n            core_name\n        )\n\n    return re.sub(\n\
          \        r\"\\s+\",\n        \" \",\n        core_name\n    ).strip()\n\n\
          \ndef tokenize(text):\n    if not text:\n        return []\n\n    return\
          \ [\n        token\n        for token in text.split()\n        if token\n\
          \    ]\n\n\ndef main(\n    invoice_name: str,\n    payment_name: str\n)\
          \ -> dict:\n\n    invoice_normalized = normalize_name(\n        invoice_name\n\
          \    )\n\n    payment_normalized = normalize_name(\n        payment_name\n\
          \    )\n\n    invoice_core_name = extract_core_name(\n        invoice_normalized\n\
          \    )\n\n    payment_core_name = extract_core_name(\n        payment_normalized\n\
          \    )\n\n    invoice_core_tokens = tokenize(\n        invoice_core_name\n\
          \    )\n\n    payment_core_tokens = tokenize(\n        payment_core_name\n\
          \    )\n\n    return {\n        \"invoice_normalized\":\n            invoice_normalized,\n\
          \n        \"payment_normalized\":\n            payment_normalized,\n\n \
          \       \"invoice_core_name\":\n            invoice_core_name,\n\n     \
          \   \"payment_core_name\":\n            payment_core_name,\n\n        \"\
          invoice_core_tokens\":\n            invoice_core_tokens,\n\n        \"payment_core_tokens\"\
          :\n            payment_core_tokens,\n\n        \"invoice_name_token_count\"\
          :\n            len(invoice_core_tokens),\n\n        \"payment_name_token_count\"\
          :\n            len(payment_core_tokens)\n    }"
        code_language: python3
