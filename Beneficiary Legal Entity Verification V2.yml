        code: "import re\n\n\nLEGAL_PATTERNS = [\n    (\n        \"TNHH_MOT_THANH_VIEN\"\
          ,\n        \"TNHH\",\n        [\n            r\"\\bCONG TY TNHH MOT THANH\
          \ VIEN\\b\",\n            r\"\\bTNHH MOT THANH VIEN\\b\"\n        ]\n  \
          \  ),\n    (\n        \"CO_PHAN\",\n        \"CO_PHAN\",\n        [\n  \
          \          r\"\\bCONG TY CO PHAN\\b\",\n            r\"\\bCO PHAN\\b\"\n\
          \        ]\n    ),\n    (\n        \"TNHH\",\n        \"TNHH\",\n      \
          \  [\n            r\"\\bCONG TY TNHH\\b\",\n            r\"\\bTNHH\\b\"\n\
          \        ]\n    ),\n    (\n        \"DOANH_NGHIEP_TU_NHAN\",\n        \"\
          DOANH_NGHIEP_TU_NHAN\",\n        [\n            r\"\\bDOANH NGHIEP TU NHAN\\\
          b\"\n        ]\n    ),\n    (\n        \"HOP_TAC_XA\",\n        \"HOP_TAC_XA\"\
          ,\n        [\n            r\"\\bHOP TAC XA\\b\"\n        ]\n    )\n]\n\n\
          \ndef extract_legal_type(name):\n    if not name:\n        return {\n  \
          \          \"legal_type\": \"UNKNOWN\",\n            \"legal_family\": \"\
          UNKNOWN\"\n        }\n\n    for legal_type, legal_family, patterns in LEGAL_PATTERNS:\n\
          \        for pattern in patterns:\n            if re.search(pattern, name):\n\
          \                return {\n                    \"legal_type\": legal_type,\n\
          \                    \"legal_family\": legal_family\n                }\n\
          \n    return {\n        \"legal_type\": \"UNKNOWN\",\n        \"legal_family\"\
          : \"UNKNOWN\"\n    }\n\n\ndef main(\n    invoice_normalized: str,\n    payment_normalized:\
          \ str\n) -> dict:\n\n    invoice = extract_legal_type(\n        invoice_normalized\n\
          \    )\n\n    payment = extract_legal_type(\n        payment_normalized\n\
          \    )\n\n    both_known = (\n        invoice[\"legal_family\"] != \"UNKNOWN\"\
          \n        and payment[\"legal_family\"] != \"UNKNOWN\"\n    )\n\n    legal_type_match\
          \ = (\n        both_known\n        and invoice[\"legal_family\"]\n     \
          \   == payment[\"legal_family\"]\n    )\n\n    legal_type_conflict = (\n\
          \        both_known\n        and invoice[\"legal_family\"]\n        != payment[\"\
          legal_family\"]\n    )\n\n    return {\n        \"invoice_legal_type\":\n\
          \            invoice[\"legal_type\"],\n\n        \"payment_legal_type\"\
          :\n            payment[\"legal_type\"],\n\n        \"invoice_legal_family\"\
          :\n            invoice[\"legal_family\"],\n\n        \"payment_legal_family\"\
          :\n            payment[\"legal_family\"],\n\n        \"legal_type_match\"\
          :\n            legal_type_match,\n\n        \"legal_type_conflict\":\n \
          \           legal_type_conflict\n    }"
