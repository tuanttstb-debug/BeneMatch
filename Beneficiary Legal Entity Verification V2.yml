    - data:
        code: "def safe_text(value):\n    \"\"\"\n    Convert None or other input\
          \ types into a safe string.\n    \"\"\"\n    if value is None:\n       \
          \ return \"\"\n\n    return str(value).strip()\n\n\ndef safe_number(value,\
          \ default=0.0):\n    \"\"\"\n    Convert Dify input into float safely.\n\
          \    \"\"\"\n    try:\n        if value is None or value == \"\":\n    \
          \        return float(default)\n\n        return float(value)\n\n    except\
          \ (TypeError, ValueError):\n        return float(default)\n\n\ndef clamp(value,\
          \ minimum=0.0, maximum=1.0):\n    \"\"\"\n    Keep numeric values inside\
          \ the expected range.\n    \"\"\"\n    return max(\n        minimum,\n \
          \       min(maximum, value)\n    )\n\n\ndef normalize_checks(checks_required):\n\
          \    \"\"\"\n    Ensure checks_required is always an array of strings.\n\
          \    Keep a maximum of three actionable checks.\n    \"\"\"\n    if not\
          \ isinstance(checks_required, list):\n        return []\n\n    normalized_checks\
          \ = []\n\n    for item in checks_required:\n        item_text = safe_text(item)\n\
          \n        if item_text:\n            normalized_checks.append(item_text)\n\
          \n    return normalized_checks[:3]\n\n\ndef build_fallback_warning(\n  \
          \  decision,\n    reason_code,\n    invoice_legal_type,\n    payment_legal_type\n\
          ):\n    \"\"\"\n    Deterministic fallback used when warning inputs are\
          \ missing\n    or AI output is invalid.\n    \"\"\"\n\n    if decision ==\
          \ \"MATCH\":\n        return {\n            \"warning_code\": \"NAME_VERIFICATION_PASSED\"\
          ,\n            \"warning_title\": \"Tên bên thụ hưởng phù hợp\",\n     \
          \       \"warning_message\": (\n                \"Tên bên thụ hưởng trên\
          \ đề nghị chuyển tiền \"\n                \"phù hợp với tên trên hóa đơn.\"\
          \n            ),\n            \"checks_required\": [],\n            \"generated_by_ai\"\
          : False,\n            \"ai_status\": \"NOT_INVOKED\"\n        }\n\n    if\
          \ (\n        decision == \"NOT_MATCH\"\n        and reason_code == \"LEGAL_ENTITY_TYPE_CONFLICT\"\
          \n    ):\n        return {\n            \"warning_code\": \"LEGAL_ENTITY_TYPE_CONFLICT\"\
          ,\n            \"warning_title\": (\n                \"Không khớp loại hình\
          \ pháp nhân\"\n            ),\n            \"warning_message\": (\n    \
          \            \"Loại hình pháp nhân không khớp. \"\n                f\"Tên\
          \ trên hóa đơn có loại hình \"\n                f\"{invoice_legal_type},\
          \ trong khi tên trên \"\n                f\"đề nghị chuyển tiền có loại\
          \ hình \"\n                f\"{payment_legal_type}.\"\n            ),\n\
          \            \"checks_required\": [\n                \"Kiểm tra lại tên\
          \ đầy đủ của bên thụ hưởng\",\n                \"Đối chiếu lại hóa đơn và\
          \ đề nghị chuyển tiền\",\n                \"Điều chỉnh thông tin trước khi\
          \ tiếp tục\"\n            ],\n            \"generated_by_ai\": False,\n\
          \            \"ai_status\": \"NOT_INVOKED\"\n        }\n\n    if decision\
          \ == \"NOT_MATCH\":\n        return {\n            \"warning_code\": (\n\
          \                reason_code or \"LOW_NAME_SIMILARITY\"\n            ),\n\
          \            \"warning_title\": (\n                \"Tên bên thụ hưởng không\
          \ phù hợp\"\n            ),\n            \"warning_message\": (\n      \
          \          \"Tên bên thụ hưởng trên đề nghị chuyển tiền \"\n           \
          \     \"có khác biệt đáng kể so với tên trên hóa đơn.\"\n            ),\n\
          \            \"checks_required\": [\n                \"Kiểm tra lại tên\
          \ đầy đủ của bên thụ hưởng\",\n                \"Đối chiếu lại hóa đơn và\
          \ đề nghị chuyển tiền\"\n            ],\n            \"generated_by_ai\"\
          : False,\n            \"ai_status\": \"NOT_INVOKED\"\n        }\n\n    return\
          \ {\n        \"warning_code\": (\n            reason_code or \"INSUFFICIENT_DATA\"\
          \n        ),\n        \"warning_title\": (\n            \"Cần kiểm tra tên\
          \ bên thụ hưởng\"\n        ),\n        \"warning_message\": (\n        \
          \    \"Thông tin tên bên thụ hưởng chưa đủ căn cứ \"\n            \"để xác\
          \ định chắc chắn là cùng pháp nhân. \"\n            \"Vui lòng kiểm tra\
          \ lại trước khi tiếp tục.\"\n        ),\n        \"checks_required\": [\n\
          \            \"Đối chiếu tên trên hóa đơn\",\n            \"Đối chiếu tên\
          \ trên đề nghị chuyển tiền\"\n        ],\n        \"generated_by_ai\": False,\n\
          \        \"ai_status\": \"FALLBACK\"\n    }\n\n\ndef main(\n    request_id:\
          \ str,\n    invoice_name: str,\n    payment_name: str,\n    invoice_account:\
          \ str,\n    payment_account: str,\n    invoice_normalized: str,\n    payment_normalized:\
          \ str,\n    invoice_legal_type: str,\n    payment_legal_type: str,\n   \
          \ legal_type_match: bool,\n    sequence_similarity: float,\n    token_similarity:\
          \ float,\n    name_similarity: float,\n    decision: str,\n    action: str,\n\
          \    risk_level: str,\n    reason_code: str,\n    name_difference_rate:\
          \ float,\n    difference_percentage: float,\n    difference_display: str,\n\
          \    warning_code: str,\n    warning_title: str,\n    warning_message: str,\n\
          \    checks_required: list,\n    generated_by_ai: bool,\n    ai_status:\
          \ str\n) -> dict:\n\n    # ----------------------------\n    # Normalize\
          \ source information\n    # ----------------------------\n\n    request_id\
          \ = safe_text(request_id)\n\n    invoice_name = safe_text(invoice_name)\n\
          \    payment_name = safe_text(payment_name)\n\n    invoice_account = safe_text(\n\
          \        invoice_account\n    )\n\n    payment_account = safe_text(\n  \
          \      payment_account\n    )\n\n    invoice_normalized = safe_text(\n \
          \       invoice_normalized\n    )\n\n    payment_normalized = safe_text(\n\
          \        payment_normalized\n    )\n\n    invoice_legal_type = (\n     \
          \   safe_text(invoice_legal_type)\n        or \"UNKNOWN\"\n    )\n\n   \
          \ payment_legal_type = (\n        safe_text(payment_legal_type)\n      \
          \  or \"UNKNOWN\"\n    )\n\n    decision = safe_text(decision)\n    action\
          \ = safe_text(action)\n    risk_level = safe_text(risk_level)\n    reason_code\
          \ = safe_text(reason_code)\n\n    # ----------------------------\n    #\
          \ Normalize similarity metrics\n    # ----------------------------\n\n \
          \   sequence_similarity = clamp(\n        safe_number(sequence_similarity)\n\
          \    )\n\n    token_similarity = clamp(\n        safe_number(token_similarity)\n\
          \    )\n\n    name_similarity = clamp(\n        safe_number(name_similarity)\n\
          \    )\n\n    name_difference_rate = clamp(\n        safe_number(\n    \
          \        name_difference_rate,\n            1.0 - name_similarity\n    \
          \    )\n    )\n\n    difference_percentage = round(\n        name_difference_rate\
          \ * 100\n    )\n\n    # Do not trust an inconsistent percentage from upstream.\n\
          \    # Recalculate from the normalized difference rate.\n    difference_percentage\
          \ = int(\n        difference_percentage\n    )\n\n    difference_display\
          \ = (\n        f\"Mức độ khác biệt tên: \"\n        f\"{difference_percentage}%\"\
          \n    )\n\n    # ----------------------------\n    # Account supporting\
          \ signal\n    # ----------------------------\n\n    same_account = (\n \
          \       bool(invoice_account)\n        and bool(payment_account)\n     \
          \   and invoice_account == payment_account\n    )\n\n    account_data_available\
          \ = (\n        bool(invoice_account)\n        and bool(payment_account)\n\
          \    )\n\n    # ----------------------------\n    # Validate warning content\n\
          \    # ----------------------------\n\n    warning_code = safe_text(warning_code)\n\
          \    warning_title = safe_text(warning_title)\n    warning_message = safe_text(warning_message)\n\
          \    ai_status = safe_text(ai_status)\n\n    normalized_checks = normalize_checks(\n\
          \        checks_required\n    )\n\n    warning_valid = (\n        bool(warning_code)\n\
          \        and bool(warning_title)\n        and bool(warning_message)\n  \
          \  )\n\n    if warning_valid:\n        final_warning = {\n            \"\
          warning_code\": warning_code,\n            \"warning_title\": warning_title,\n\
          \            \"warning_message\": warning_message,\n            \"checks_required\"\
          : normalized_checks,\n            \"generated_by_ai\": bool(\n         \
          \       generated_by_ai\n            ),\n            \"ai_status\": (\n\
          \                ai_status or \"SUCCESS\"\n            )\n        }\n\n\
          \    else:\n        final_warning = build_fallback_warning(\n          \
          \  decision=decision,\n            reason_code=reason_code,\n          \
          \  invoice_legal_type=invoice_legal_type,\n            payment_legal_type=payment_legal_type\n\
          \        )\n\n    # AI is allowed only to generate warning text for REVIEW.\n\
          \    # Any AI flag received for MATCH or NOT_MATCH is neutralized.\n   \
          \ if decision != \"REVIEW\":\n        final_warning[\"generated_by_ai\"\
          ] = False\n        final_warning[\"ai_status\"] = \"NOT_INVOKED\"\n\n  \
          \  # AI never participates in the final decision.\n    ai_used_for_decision\
