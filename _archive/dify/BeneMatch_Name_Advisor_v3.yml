    - data:
        context:
          enabled: false
          variable_selector: []
        model:
          completion_params: {}
          mode: chat
          name: gemini-3.8-flash
          provider: langgenius/gemini/google
        prompt_config:
          jinja2_variables: []
        prompt_template:
        - id: a1b2c3d4-0001-4000-8000-000000000001
          role: system
          text: 'Bạn là chuyên gia thẩm định tên pháp nhân doanh nghiệp Việt Nam, hỗ trợ cán bộ ngân hàng kiểm tra NGƯỜI THỤ HƯỞNG trước khi giải ngân theo hóa đơn.

            Nhiệm vụ: đánh giá TÊN BÊN BÁN trên hóa đơn và TÊN NGƯỜI THỤ HƯỞNG trên lệnh chuyển tiền (UNC) có cùng một pháp nhân hay không.


            Ý kiến của bạn CHỈ ĐỂ THAM KHẢO. Kết luận chính thức do engine luật của ngân hàng quyết định; bạn không thay đổi kết luận đó.


            Kiến thức cần áp dụng:

            - Loại hình pháp nhân: Công ty TNHH (gồm TNHH MTV/2TV), Công ty cổ phần (CTCP, JSC), Doanh nghiệp tư nhân, Hợp tác xã, Công ty hợp danh, Hộ kinh doanh. KHÁC loại hình (vd TNHH ≠ Cổ phần) ⇒ LUÔN là hai pháp nhân khác nhau.

            - Tên tiếng Anh/tên giao dịch có thể là bản dịch nghĩa của tên riêng (vd "Sao Việt" ↔ "Vietstar", "Ánh Dương" ↔ "Sunshine"); từ ngành nghề (Thương mại=Trading, Dịch vụ=Services, Xây dựng=Construction, Thực phẩm=Foods, Vận tải biển=Shipping…) không phải tên riêng.

            - Viết tắt/tên thương hiệu thường ghép chữ cái đầu của phần tên (vd "An Phát Technical Services" → APTS). Viết tắt ≤ 3 chữ cái rất mơ hồ.

            - Tổng công ty / Tập đoàn ↔ công ty con, công ty "số 3", công ty "miền Bắc"… là CÁC PHÁP NHÂN KHÁC NHAU dù tên gần giống ⇒ RELATED_ENTITY.

            - Chi nhánh, văn phòng đại diện, địa điểm kinh doanh thuộc cùng pháp nhân với công ty mẹ ⇒ SAME_ENTITY, relation BRANCH.

            - Hộ kinh doanh có thể nhận tiền vào tài khoản cá nhân của chủ hộ (cùng họ tên).

            - Thêm/bớt một chữ trong PHẦN TÊN RIÊNG (vd "Hoàng Gia" ↔ "Hoàng Gia Phát") thường là doanh nghiệp khác. Khác số hiệu (số 1 ↔ số 7) là doanh nghiệp khác.

            - Lỗi OCR hay gặp: O↔0, I/L↔1, E↔F, mất dấu; tên trên UNC thường không dấu, viết hoa, có thể bị cắt cụt.

            - Bạn KHÔNG có dữ liệu đăng ký kinh doanh: không được khẳng định doanh nghiệp đã đổi tên; nếu nghi đổi tên ⇒ UNCERTAIN, relation RENAMED.


            Nguyên tắc an toàn: nhầm "cùng pháp nhân" gây chuyển tiền sai người — nghiêm trọng hơn nhiều so với báo "chưa đủ căn cứ". Chỉ trả SAME_ENTITY khi có căn cứ rõ ràng; phân vân ⇒ UNCERTAIN.


            Trả về JSON đúng schema:

            - verdict: SAME_ENTITY | DIFFERENT_ENTITY | RELATED_ENTITY | UNCERTAIN

            - relation: IDENTICAL | ABBREVIATION | TRANSLATION | TRANSLITERATION | TRUNCATION | TYPO_OCR | BRANCH | PARENT_SUBSIDIARY | RENAMED | UNRELATED | UNKNOWN

            - confidence: số 0..1 (mức chắc chắn của verdict)

            - evidence: tối đa 4 căn cứ ngắn, cụ thể (chỉ ra từ nào tương ứng từ nào)

            - explanation: 1–3 câu tiếng Việt cho cán bộ

            - checks_for_officer: tối đa 3 việc cán bộ cần kiểm tra thêm (vd đối chiếu tên chủ tài khoản, MST, giấy ĐKKD)'
        - id: a1b2c3d4-0002-4000-8000-000000000002
          role: user
          text: 'Tên bên bán trên HÓA ĐƠN: {{#1790000000001.invoice_name#}}

            Tên người thụ hưởng trên UNC: {{#1790000000001.payment_name#}}


            Kết quả engine luật (tham khảo): {{#1790000000001.engine_decision#}} — mã {{#1790000000001.engine_reason#}} — độ tương đồng kỹ thuật {{#1790000000001.engine_score#}}%

            Diễn giải engine: {{#1790000000001.engine_explanation#}}

            Loại hình (họ): hóa đơn = {{#1790000000001.invoice_legal#}}; UNC = {{#1790000000001.payment_legal#}}

            Tên lõi sau chuẩn hóa: hóa đơn = {{#1790000000001.invoice_core#}}; UNC = {{#1790000000001.payment_core#}}


            Đánh giá hai tên và trả JSON theo schema.'
        selected: false
        structured_output:
          schema:
            type: object
            required:
            - verdict
            - relation
            - confidence
            - evidence
            - explanation
            - checks_for_officer
            properties:
              verdict:
                type: string
                enum:
                - SAME_ENTITY
                - DIFFERENT_ENTITY
                - RELATED_ENTITY
                - UNCERTAIN
              relation:
                type: string
                enum:
                - IDENTICAL
                - ABBREVIATION
                - TRANSLATION
                - TRANSLITERATION
                - TRUNCATION
                - TYPO_OCR
                - BRANCH
                - PARENT_SUBSIDIARY
                - RENAMED
                - UNRELATED
                - UNKNOWN
              confidence:
                type: number
              evidence:
                type: array
                items:
                  type: string
                maxItems: 4
              explanation:
                type: string
              checks_for_officer:
                type: array
                items:
                  type: string
                maxItems: 3
        structured_output_enabled: true
        title: LLM Name Advisor (Gemini 3.8 Flash)
        type: llm
        vision:
          enabled: false
      height: 90
      id: '1790000000002'
      position:
        x: 340
        y: 0
      positionAbsolute:
        x: 340
        y: 0
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
      zIndex: 0
    - data:
        code: "import json\n\nVERDICTS = [\"SAME_ENTITY\", \"DIFFERENT_ENTITY\", \"RELATED_ENTITY\", \"UNCERTAIN\"]\nRELATIONS = [\"IDENTICAL\", \"ABBREVIATION\", \"TRANSLATION\", \"TRANSLITERATION\", \"TRUNCATION\", \"TYPO_OCR\",\n             \"BRANCH\", \"PARENT_SUBSIDIARY\", \"RENAMED\", \"UNRELATED\", \"UNKNOWN\"]\n\n\ndef _parse(structured, text):\n    if isinstance(structured, dict) and structured.get(\"verdict\"):\n        return structured\n    t = (text or \"\").strip()\n    if \"{\" in t and \"}\" in t:\n        try:\n            return json.loads(t[t.index(\"{\"): t.rindex(\"}\") + 1])\n        except Exception:\n            return None\n    return None\n\n\ndef main(structured: dict, text: str, invoice_legal: str, payment_legal: str) -> dict:\n    a = _parse(structured, text)\n    ok = isinstance(a, dict) and a.get(\"verdict\") in VERDICTS\n    a = a if isinstance(a, dict) else {}\n    verdict = a.get(\"verdict\") if a.get(\"verdict\") in VERDICTS else \"UNCERTAIN\"\n    relation = a.get(\"relation\") if a.get(\"relation\") in RELATIONS else \"UNKNOWN\"\n    try:\n        conf = max(0.0, min(1.0, float(a.get(\"confidence\", 0))))\n    except Exception:\n        conf = 0.0\n    notes = []\n    fi, fp = (invoice_legal or \"UNKNOWN\"), (payment_legal or \"UNKNOWN\")\n    if verdict == \"SAME_ENTITY\" and fi != \"UNKNOWN\" and fp != \"UNKNOWN\" and fi != fp:\n        verdict, conf = \"UNCERTAIN\", min(conf, 0.5)\n        notes.append(\"Khác loại hình pháp nhân — luật cứng.\")\n    if verdict == \"SAME_ENTITY\" and relation == \"PARENT_SUBSIDIARY\":\n        verdict = \"RELATED_ENTITY\"\n        notes.append(\"Mẹ ↔ con là hai pháp nhân khác nhau.\")\n\n    def arr(x, n):\n        return [str(s)[:300] for s in (x if isinstance(x, list) else []) if s][:n]\n\n    return {\"result\": {\n        \"ai_status\": \"OK\" if ok else \"FALLBACK\",\n        \"verdict\": verdict, \"relation\": relation, \"confidence\": round(conf, 2),\n        \"evidence\": arr(a.get(\"evidence\"), 4),\n        \"explanation\": str(a.get(\"explanation\", \"\"))[:800],\n        \"checks_for_officer\": arr(a.get(\"checks_for_officer\"), 3),\n        \"guard_notes\": notes, \"model\": \"gemini-3.8-flash\", \"used_for_decision\": False,\n    }}\n"
        code_language: python3
        outputs:
          result:
            children: null
            type: object
        selected: false
        title: Validate & Guard
        type: code
        variables:
        - value_selector:
          - '1790000000002'
          - structured_output
          value_type: object
          variable: structured
        - value_selector:
          - '1790000000002'
          - text
          value_type: string
          variable: text
        - value_selector:
          - '1790000000001'
          - invoice_legal
          value_type: string
          variable: invoice_legal
        - value_selector:
          - '1790000000001'
          - payment_legal
          value_type: string
          variable: payment_legal
      height: 90
      id: '1790000000003'
      position:
        x: 680
        y: 0
      positionAbsolute:
        x: 680
        y: 0
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
      zIndex: 0
    - data:
        outputs:
        - value_selector:
          - '1790000000003'
          - result
          value_type: object
          variable: result
        selected: false
        title: Output
        type: end
      height: 90
